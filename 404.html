<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- Instant JavaScript Redirect (No Delay) -->
    <script>
        window.location.replace("https://oloo.fyi");
    </script>

    <!-- Fallback Meta Refresh Redirect (Just in case JS is disabled) -->
    <noscript>
        <meta http-equiv="refresh" content="0;url=https://oloo.fyi">
    </noscript>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .redirect-box {
            text-align: center;
        }
        p {
            font-size: 1.1rem;
            color: #94a3b8;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <p>Redirecting to <a href="https://oloo.fyi">oloo.fyi</a>...</p>
    </div>
</body>
</html>
